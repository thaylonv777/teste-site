<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel — Átrio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315191F'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%2351B5BB'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#0A0A0B; --surface:#111113; --surface2:#17171a; --line:rgba(243,238,228,.12);
  --fg:#F3EEE4; --muted:rgba(243,238,228,.62);
  --accent:#51B5BB; --accent-l:#8ED3D7; --accent-deep:#2F8488;
  --r:16px; --rs:11px; --maxw:900px;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,-apple-system,sans-serif;
  padding:28px 16px 60px;-webkit-font-smoothing:antialiased;overscroll-behavior-x:none}
.wrap{max-width:var(--maxw);margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand-logo{height:30px;width:auto;display:block;filter:invert(1)}
.brand-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none}
.sub{color:var(--muted);font-size:13px}
.refresh{background:var(--surface);border:1px solid var(--line);color:var(--accent-l);font-size:13px;font-weight:600;
  padding:9px 16px;border-radius:999px;cursor:pointer}
.refresh:hover{border-color:var(--accent)}

.tabs{display:flex;gap:8px;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:14px;
  flex-wrap:wrap}
.tab{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;
  padding:8px 16px;border-radius:999px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px}
.tab .d{width:7px;height:7px;border-radius:50%;flex:none}
.tab.on{color:#07181a;background:var(--accent-l);border-color:var(--accent-l)}

@media(max-width:620px){
  body{padding:18px 14px 50px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none}
  .period-bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
  .period-bar::-webkit-scrollbar{display:none}
  .period-btn{flex:none}
  .toggle-bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .toggle-bar::-webkit-scrollbar{display:none}
  .toggle-btn{flex:none}
  .cards{grid-template-columns:1fr 1fr}
  .head{gap:8px}
  .head .sub{display:none}
}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:26px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--surface);
  border:1px solid var(--line);border-radius:var(--rs);padding:16px;
  box-shadow:0 2px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.03)}
.card .n{font-size:26px;font-weight:800;color:var(--accent-l)}
.card .l{font-size:12px;color:var(--muted);margin-top:2px}
.card .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.card .stat-grid div{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .stat-grid b{color:var(--fg);font-weight:700}
.sess-metrics{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6}
.sess-metrics b{color:var(--fg)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px}
@media(max-width:620px){.charts{grid-template-columns:1fr}}
.chart-card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--surface);
  border:1px solid var(--line);border-radius:var(--rs);padding:16px;
  box-shadow:0 2px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.03)}
.period-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.period-btn{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;
  padding:7px 14px;border-radius:999px;cursor:pointer;font-family:inherit}
.period-btn.on{color:#07181a;background:var(--accent-l);border-color:var(--accent-l)}
.toggle-bar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.toggle-btn{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;
  padding:6px 13px;border-radius:999px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.toggle-btn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.toggle-btn.on{color:var(--accent-l);border-color:var(--accent)}
.toggle-btn.on::before{background:var(--accent-l)}
.camp-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.camp-card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--surface);
  border:1px solid var(--line);border-left:3px solid #8E7CC3;border-radius:var(--rs);padding:16px;
  box-shadow:0 2px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.03)}
.camp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.camp-badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;flex:none}
.camp-name{font-size:13px;color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.camp-top{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.camp-spend{font-size:22px;font-weight:800;color:var(--accent-l)}
.camp-sub{font-size:12px;color:var(--muted)}
.camp-table-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:var(--rs);
  background:var(--surface);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.camp-table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.camp-table th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.03em;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.camp-table td{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--fg)}
.camp-table tbody tr:last-child td{border-bottom:none}
.camp-table tbody tr:hover{background:rgba(255,255,255,.03)}
.camp-table td:first-child{white-space:normal;min-width:220px}
.camp-table .camp-sub{font-size:10.5px}
.chart-card .ct{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
.pie-row{display:flex;align-items:center;gap:16px}
.pie-row svg{flex:none}
.legend{display:flex;flex-direction:column;gap:6px;min-width:0}
.legend-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-item .dot{width:8px;height:8px;border-radius:50%;flex:none}
.legend-item b{color:var(--fg)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-size:11.5px;color:var(--muted);width:72px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:4px}
.bar-val{font-size:11.5px;color:var(--fg);font-weight:700;width:68px;text-align:right;flex:none}
.section-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}

.compare{display:flex;flex-direction:column;gap:8px;margin-bottom:30px}
.cmp-row{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--surface);
  border:1px solid var(--line);border-radius:var(--rs);padding:13px 16px;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s}
.cmp-row:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.cmp-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cmp-left{display:flex;align-items:center;gap:9px;min-width:0}
.cmp-left .d{width:8px;height:8px;border-radius:50%;flex:none}
.cmp-left b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-right{display:flex;align-items:center;gap:16px;flex:none;font-size:12.5px;color:var(--muted)}
.cmp-right b{color:var(--fg);font-size:14px}
.cmp-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.06);margin-top:10px;overflow:hidden}
.cmp-bar i{display:block;height:100%}
.cmp-ads{font-size:11.5px;color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.cmp-ads b{color:var(--fg)}

.funnel{display:flex;flex-direction:column;gap:10px}
.step{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--surface);
  border:1px solid var(--line);border-radius:var(--rs);padding:14px 16px;position:relative;overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.3)}
.step .bar{position:absolute;left:0;top:0;bottom:0;z-index:0}
.step-content{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.step-left{display:flex;align-items:center;gap:12px;min-width:0}
.step-idx{font-weight:800;font-size:13px;flex:none;width:26px}
.step-label{font-size:13.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px}
.step-right{display:flex;align-items:center;gap:16px;flex:none}
.step-n{font-weight:700;font-size:15px}
.step-pct{font-size:12px;color:var(--muted);min-width:46px;text-align:right}
.drop{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(239,68,68,.12);color:#f87171;font-weight:600}
.drop.ok{background:rgba(74,222,128,.12);color:#4ade80}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:40px 0}
.updated{color:var(--muted);font-size:11.5px;margin-top:18px;text-align:center}

.sessions{display:flex;flex-direction:column;gap:8px;margin-top:34px}
.sess{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--surface);
  border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s}
.sess:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.sess-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sess-right{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:1 1 auto;min-width:0}
.sess-step{font-size:12px;color:var(--accent-l);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-tag,.sess-count,.sess-caret{flex:none}
.sess-count{font-size:11px;color:var(--muted)}
.sess-caret{color:var(--accent);font-size:11px;transition:.15s}
.sess.open .sess-caret{transform:rotate(90deg)}
.sess-answers{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg)}
.sess.open .sess-answers{display:block}
.ans-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ans-row:last-child{border-bottom:none}
.ans-q{color:var(--muted);flex:1}
.ans-a{color:var(--accent-l);font-weight:600;text-align:right;flex:none;max-width:50%}
.ans-empty{color:var(--muted);font-size:12px}
.sess-when{flex:none;font-size:12.5px;font-weight:600;color:var(--fg);white-space:nowrap}
.sess-src{flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;color:#fff}
.src-tt{background:#111;box-shadow:inset 0 0 0 1px #25F4EE,2px 0 0 #FE2C55}
.src-meta{background:#0866FF}
.src-other{background:#3A3F4B}
.sess-tag{font-size:11px;font-weight:700;color:#07181a;border-radius:999px;padding:2px 8px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soon{color:var(--muted);font-size:13.5px;line-height:1.6;padding:30px 4px}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.gate-box{width:100%;max-width:320px;text-align:center}
.gate-box .brand-logo{height:34px;width:auto;filter:invert(1);margin-bottom:22px}
.gate-box input{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--fg);font-size:15px;
  padding:12px 14px;border-radius:var(--rs);font-family:inherit;outline:none;text-align:center;margin-bottom:10px}
.gate-box input:focus{border-color:var(--accent)}
.gate-box button{width:100%;background:var(--accent-l);border:none;color:#07181a;font-size:14px;font-weight:700;
  padding:12px 14px;border-radius:var(--rs);cursor:pointer;font-family:inherit}
.gate-box .err{color:#e98a8a;font-size:12.5px;margin-top:10px;min-height:16px}
body.locked .wrap{display:none}
</style>
</head>
<body class="locked">
<div class="gate" id="gate">
  <div class="gate-box">
    <img src="assets/logo.png" alt="Átrio" class="brand-logo">
    <input type="password" id="gatePass" placeholder="Senha" autocomplete="current-password">
    <button id="gateBtn">Entrar</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>
<script>
(function(){
  var HASH = "fee30ff8cb7b8b9d49cf229d140f75be1c6fda2f4f088d11828da69b25aac251";
  async function sha256(txt){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  }
  function unlock(){
    document.body.classList.remove("locked");
    var g = document.getElementById("gate");
    if (g) g.remove();
  }
  if (sessionStorage.getItem("painel_auth") === HASH) {
    unlock();
  } else {
    var pass = document.getElementById("gatePass");
    var btn = document.getElementById("gateBtn");
    var err = document.getElementById("gateErr");
    var tentar = async function(){
      var h = await sha256(pass.value || "");
      if (h === HASH) {
        sessionStorage.setItem("painel_auth", HASH);
        unlock();
      } else {
        err.textContent = "Senha incorreta.";
        pass.value = "";
        pass.focus();
      }
    };
    btn.onclick = tentar;
    pass.addEventListener("keydown", function(e){ if (e.key === "Enter") tentar(); });
    setTimeout(function(){ pass.focus(); }, 50);
  }
})();
</script>

  <div class="head">

      <div class="brand"><img src="assets/logo.png" alt="Átrio Marketing & Business" class="brand-logo"></div>

<script>
/* ============================================================
   REGISTRO DE FONTES — pra adicionar um funil novo, só criar
   uma entrada aqui com um statsUrl que devolva o mesmo formato:
   { total_sessions, total_eventos, steps:[...], sessions:[...], generated_at }
   Campos opcionais por fonte: tagField (resposta destacada na
   lista de sessões, ex. "nicho" ou "preco") e tagPrefix.
   Fontes do tipo "soon" ainda não têm integração — aparecem na
   aba mas mostram um aviso, reservando o lugar no painel.
   ============================================================ */
var FONTES = [
  { id:"site", type:"funnel", label:"Quiz · Site", color:"#51B5BB", statsUrl:"https://n8n.manuai.com.br/webhook/funil-site-stats", tagField:"nicho" },
  { id:"vgv",  type:"funnel", label:"Código VGV",  color:"#C9A45C", statsUrl:"https://n8n.manuai.com.br/webhook/funil-vgv-stats",  tagField:"preco", tagPrefix:"R$ " },
  { id:"dentista", type:"funnel", label:"Funil Dentista", color:"#D98E73", statsUrl:"https://n8n.manuai.com.br/webhook/funil-dentista-stats", tagField:"nicho" },
  { id:"ads",     type:"ads", label:"Campanhas de anúncio", color:"#8E7CC3", statsUrl:"https://n8n.manuai.com.br/webhook/ads-stats" },
  { id:"clientes",type:"soon", label:"Clientes" }
];

var cache = {}; // id -> data
var active = "geral";
var adsPeriod = "hoje"; // hoje | 3d | 7d | 30d | total
var filtroAtivas = false;
var filtroVeiculacao = false;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function brl(v){ return 'R$ '+(Number(v||0)).toFixed(2); }

// calcula since/until (YYYY-MM-DD) e o rótulo pro período selecionado das campanhas
// meia-noite em São Paulo (UTC-3), como instante UTC — independe do fuso do navegador.
// (usar toISOString().slice(0,10) direto usava o dia em UTC, que vira o dia seguinte
// a partir das 21h de Brasília, zerando "Hoje" nas últimas horas do dia.)
function spMidnight(offsetDays){
  var fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' });
  var parts = fmt.formatToParts(new Date()).reduce(function(o,p){ o[p.type]=p.value; return o; }, {});
  return new Date(Date.UTC(+parts.year, +parts.month - 1, +parts.day + offsetDays, 3, 0, 0));
}
function periodRange(key){
  function iso(d){ return d.toISOString(); }
  var tomorrow = iso(spMidnight(1));
  switch(key){
    case "hoje": return { since: iso(spMidnight(0)), until: tomorrow, label: "Hoje" };
    case "3d":   return { since: iso(spMidnight(-2)), until: tomorrow, label: "Últimos 3 dias" };
    case "7d":   return { since: iso(spMidnight(-6)), until: tomorrow, label: "Últimos 7 dias" };
    case "30d":  return { since: iso(spMidnight(-29)), until: tomorrow, label: "Últimos 30 dias" };
    default:     return { since: null, until: null, label: "Total" };
  }
}

// gráfico de pizza (donut) em SVG puro, sem dependências externas
// mostra TODOS os itens na legenda (mesmo com valor 0) — só não desenha fatia pra quem é 0
function pieChart(title, items){
  var total = items.reduce(function(s,i){return s+i.value},0);
  var nonZero = items.filter(function(it){ return it.value>0; });
  var cx=70, cy=70, r=60, start=-90;
  var paths = '';
  if(!total){
    paths = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"></circle>';
  } else if(nonZero.length===1){
    paths = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+nonZero[0].color+'"></circle>';
  } else {
    paths = nonZero.map(function(it){
      var pct = it.value/total;
      var angle = pct*360;
      var end = start+angle;
      var large = angle>180?1:0;
      var x1 = cx + r*Math.cos(start*Math.PI/180), y1 = cy + r*Math.sin(start*Math.PI/180);
      var x2 = cx + r*Math.cos(end*Math.PI/180), y2 = cy + r*Math.sin(end*Math.PI/180);
      var d = 'M'+cx+','+cy+' L'+x1.toFixed(2)+','+y1.toFixed(2)+' A'+r+','+r+' 0 '+large+' 1 '+x2.toFixed(2)+','+y2.toFixed(2)+' Z';
      start = end;
      return '<path d="'+d+'" fill="'+it.color+'"></path>';
    }).join('');
  }
  var legend = items.map(function(it){
    var pct = total ? Math.round((it.value/total)*1000)/10 : 0;
    return '<div class="legend-item"><span class="dot" style="background:'+it.color+'"></span>'+esc(it.label)+' — <b>'+pct+'%</b></div>';
  }).join('') || '<div class="legend-item">Sem dados</div>';
  return '<div class="chart-card"><div class="ct">'+esc(title)+'</div><div class="pie-row">'+
    '<svg viewBox="0 0 140 140" width="120" height="120">'+paths+'</svg>'+
    '<div class="legend">'+legend+'</div></div></div>';
}

// gráfico de barras horizontais em HTML/CSS puro
function barChart(title, items, fmt){
  var max = Math.max.apply(null, items.map(function(i){return i.value}).concat([1]));
  var rows = items.map(function(it){
    var pct = max ? Math.round((it.value/max)*100) : 0;
    return '<div class="bar-row"><div class="bar-label">'+esc(it.label)+'</div>'+
      '<div class="bar-track"><i style="width:'+pct+'%;background:'+it.color+'"></i></div>'+
      '<div class="bar-val">'+esc(fmt?fmt(it.value):it.value)+'</div></div>';
  }).join('') || '<div class="legend-item">Sem dados</div>';
  return '<div class="chart-card"><div class="ct">'+esc(title)+'</div><div class="bars">'+rows+'</div></div>';
}

function renderTabs(){
  var html = '<button class="tab'+(active==="geral"?" on":"")+'" data-id="geral"><span class="d" style="background:#fff"></span>Visão geral</button>';
  FONTES.forEach(function(f){
    html += '<button class="tab'+(active===f.id?" on":"")+'" data-id="'+f.id+'"><span class="d" style="background:'+(f.color||"#777")+'"></span>'+esc(f.label)+'</button>';
  });
  document.getElementById("tabs").innerHTML = html;
  document.querySelectorAll(".tab").forEach(function(btn){
    btn.onclick = function(){ active = btn.getAttribute("data-id"); try{localStorage.setItem("painel_tab",active)}catch(e){}; draw(); };
  });
}

function fetchFonte(f){
  if(f.type !== "funnel" && f.type !== "ads") return Promise.resolve(null);
  // sessões/eventos de funil e métricas de anúncio seguem o MESMO período selecionado,
  // por isso ambos têm cache por período (não só o ads).
  var periodo = periodRange(adsPeriod);
  var key = (f.type === "ads" ? "ads_" : (f.id+"_")) + adsPeriod;
  var url = f.statsUrl;
  if(periodo.since) url += (url.indexOf("?")>=0?"&":"?") + "since=" + periodo.since + "&until=" + periodo.until;
  if(cache[key]) return Promise.resolve(cache[key]);
  return fetch(url).then(function(resp){ return resp.json(); }).then(function(d){ cache[key]=d; return d; }).catch(function(){ return null; });
}

function setAdsPeriod(p){
  if(p === adsPeriod) return;
  adsPeriod = p;
  try{ localStorage.setItem("painel_ads_period", p); }catch(e){}
  document.getElementById("view").innerHTML = '<div class="empty">Carregando...</div>';
  loadAll().then(function(){ draw(); touchRefreshLabel(); });
}

function loadAll(){
  return Promise.all(FONTES.map(fetchFonte));
}

function convRate(data){
  if(!data) return 0;
  var steps = data.steps||[];
  var last = steps.length ? steps[steps.length-1] : null;
  return (data.total_sessions && last) ? Math.round((last.sessions/data.total_sessions)*1000)/10 : 0;
}

function viewGeral(){
  var periodo = periodRange(adsPeriod);
  var adsData = cache["ads_"+adsPeriod];
  var byProject = (adsData && adsData.by_project) || {};
  var byCampaign = (adsData && adsData.by_campaign) || [];
  var OBJ_LABEL = { compra:"Compra", lead:"Lead" };
  var NOMES = { vgv:"Código VGV", site:"Quiz · Site", dentista:"Funil Dentista", outros:"Outros/não classificado" };
  var CORES = { vgv:"#C9A45C", site:"#51B5BB", dentista:"#D98E73", outros:"#8E7CC3" };

  var periodsHtml = '<div class="period-bar">' +
    [["hoje","Hoje"],["3d","3 dias"],["7d","7 dias"],["30d","30 dias"],["total","Total"]].map(function(p){
      return '<button class="period-btn'+(adsPeriod===p[0]?" on":"")+'" data-period="'+p[0]+'">'+p[1]+'</button>';
    }).join('') + '</div>';

  var funis = FONTES.filter(function(f){ return f.type==="funnel"; });
  var totalSessions = 0, totalEventos = 0, totalGasto = 0;
  var rows = funis.map(function(f){
    var d = cache[f.id+"_"+adsPeriod];
    var sessions = d ? (d.total_sessions||0) : 0;
    var eventos = d ? (d.total_eventos||0) : 0;
    var conv = convRate(d);
    var ad = byProject[f.id];
    totalSessions += sessions; totalEventos += eventos;
    if(ad) totalGasto += ad.spend;
    return {f:f, sessions:sessions, eventos:eventos, conv:conv, ok: !!d, ad:ad};
  });
  var maxSessions = Math.max.apply(null, rows.map(function(r){return r.sessions}).concat([1]));

  var html = periodsHtml;
  html += '<div class="cards">'+
    '<div class="card"><div class="n">'+totalSessions+'</div><div class="l">Sessões — todos os funis</div></div>'+
    '<div class="card"><div class="n">'+totalEventos+'</div><div class="l">Eventos registrados</div></div>'+
    '<div class="card"><div class="n">'+brl(totalGasto)+'</div><div class="l">Investido em anúncios — '+esc(periodo.label)+'</div></div>'+
    '<div class="card"><div class="n">'+funis.length+'</div><div class="l">Funis ativos</div></div>'+
  '</div>';

  html += '<div class="section-title">Comparativo entre projetos — '+esc(periodo.label)+'</div><div class="compare">';
  rows.forEach(function(r){
    var pct = maxSessions ? Math.round((r.sessions/maxSessions)*100) : 0;
    var adLine = '';
    if(r.ad){
      var objetivo = r.ad.objetivo||'lead';
      adLine = '<div class="cmp-ads">'+brl(r.ad.spend)+' investido · Resultados ('+OBJ_LABEL[objetivo]+'): <b>'+r.ad.resultados+'</b> · Custo/resultado: <b>'+brl(r.ad.custo_por_resultado)+'</b></div>';
    }
    html += '<div class="cmp-row" data-id="'+r.f.id+'">'+
      '<div class="cmp-top"><div class="cmp-left"><span class="d" style="background:'+r.f.color+'"></span><b>'+esc(r.f.label)+'</b></div>'+
      '<div class="cmp-right">'+(r.ok?'':'<span>sem dados</span>')+(r.ok?('<span>'+r.conv+'% conversão</span><b>'+r.sessions+' sessões</b>'):'')+'</div></div>'+
      '<div class="cmp-bar"><i style="width:'+pct+'%;background:'+r.f.color+'"></i></div>'+
      adLine +
    '</div>';
  });
  var soon = FONTES.filter(function(f){ return f.type==="soon"; });
  if(soon.length){
    html += soon.map(function(f){
      return '<div class="cmp-row" style="cursor:default;opacity:.55"><div class="cmp-top"><div class="cmp-left"><span class="d" style="background:#555"></span><b>'+esc(f.label)+'</b></div>'+
        '<div class="cmp-right"><span>em breve</span></div></div></div>';
    }).join("");
  }
  html += '</div>';

  html += '<div class="section-title">Campanhas — '+esc(periodo.label)+'</div>';
  html += '<div class="toggle-bar">'+
    '<button class="toggle-btn'+(filtroAtivas?' on':'')+'" id="toggleAtivas">Somente ativas</button>'+
    '<button class="toggle-btn'+(filtroVeiculacao?' on':'')+'" id="toggleVeiculacao">Somente com veiculação</button>'+
  '</div>';
  var campFiltradas = byCampaign.filter(function(c){
    if(filtroAtivas && c.effective_status !== 'ACTIVE') return false;
    if(filtroVeiculacao && !(c.impressions>0 || c.spend>0)) return false;
    return true;
  });
  if(!campFiltradas.length){
    html += '<div class="empty">Nenhuma campanha '+(byCampaign.length?'com esse filtro':'com dados')+' nesse período.</div>';
  } else {
    html += '<div class="camp-table-wrap"><table class="camp-table"><thead><tr>'+
      '<th>Campanha</th><th>Alcance</th><th>Valor gasto</th><th>Resultado</th><th>Custo/resultado</th>'+
      '<th>Checkout</th><th>Custo/checkout</th><th>Cliques no link</th><th>Custo/clique no link</th>'+
      '<th>CTR clique no link</th><th>Visualização de página de destino</th><th>CPM</th>'+
      '</tr></thead><tbody>';
    campFiltradas.forEach(function(c){
      var objetivo = c.objetivo || 'lead';
      var cor = CORES[c.projeto]||'#8E7CC3';
      html += '<tr>'+
        '<td><span class="camp-badge" style="background:'+cor+'33;color:'+cor+'">'+esc(NOMES[c.projeto]||c.projeto)+'</span> '+esc(c.campaign_name)+'</td>'+
        '<td>'+c.reach+'</td>'+
        '<td>'+brl(c.spend)+'</td>'+
        '<td>'+c.resultados+'<br><span class="camp-sub">'+(objetivo==='compra'?'Compra':'Lead')+'</span></td>'+
        '<td>'+brl(c.custo_por_resultado)+'</td>'+
        '<td>'+c.initiate_checkout+'</td>'+
        '<td>'+brl(c.custo_por_checkout)+'</td>'+
        '<td>'+c.clicks+'</td>'+
        '<td>'+brl(c.cpc)+'</td>'+
        '<td>'+c.ctr+'%</td>'+
        '<td>'+c.landing_page_views+'</td>'+
        '<td>'+brl(c.cpm)+'</td>'+
      '</tr>';
    });
    html += '</tbody></table></div>';
  }

  document.getElementById("view").innerHTML = html;
  bindPeriodButtons();
  document.querySelectorAll(".cmp-row[data-id]").forEach(function(el){
    el.onclick = function(){ active = el.getAttribute("data-id"); draw(); };
  });
  var btnAtivas = document.getElementById("toggleAtivas");
  var btnVeic = document.getElementById("toggleVeiculacao");
  if(btnAtivas) btnAtivas.onclick = function(){ filtroAtivas = !filtroAtivas; if(filtroAtivas) filtroVeiculacao = false; draw(); };
  if(btnVeic) btnVeic.onclick = function(){ filtroVeiculacao = !filtroVeiculacao; if(filtroVeiculacao) filtroAtivas = false; draw(); };
}

function viewSoon(f){
  document.getElementById("view").innerHTML =
    '<div class="section-title">'+esc(f.label)+'</div>'+
    '<div class="soon">Essa fonte ainda não está integrada ao painel.<br>Quando os dados de '+esc(f.label).toLowerCase()+' estiverem disponíveis, essa aba passa a mostrar os indicadores aqui — sem mudar o resto do painel.</div>';
}

function viewAds(f){
  var periodo = periodRange(adsPeriod);
  var data = cache["ads_"+adsPeriod];

  var periodsHtml = '<div class="period-bar">' +
    [["hoje","Hoje"],["3d","3 dias"],["7d","7 dias"],["30d","30 dias"],["total","Total"]].map(function(p){
      return '<button class="period-btn'+(adsPeriod===p[0]?" on":"")+'" data-period="'+p[0]+'">'+p[1]+'</button>';
    }).join('') + '</div>';

  if(!data){
    document.getElementById("view").innerHTML = periodsHtml + '<div class="empty">Carregando...</div>';
    bindPeriodButtons();
    return;
  }
  var byProject = data.by_project || {};
  var byCampaign = data.by_campaign || [];
  var NOMES = { vgv:"Código VGV", site:"Quiz · Site", dentista:"Funil Dentista", outros:"Outros/não classificado" };
  var CORES = { vgv:"#C9A45C", site:"#51B5BB", dentista:"#D98E73", outros:"#8E7CC3" };
  var OBJ_LABEL = { compra:"Compra", lead:"Lead" };
  var projKeys = Object.keys(byProject);

  var html = periodsHtml;

  // gráficos estratégicos
  html += '<div class="section-title">Visão geral de campanhas — '+esc(periodo.label)+'</div><div class="charts">';
  html += pieChart('Gasto por projeto', projKeys.map(function(p){
    return { label:NOMES[p]||p, value:byProject[p].spend, color:CORES[p]||'#888' };
  }));
  html += barChart('Custo por resultado (objetivo de cada projeto)', projKeys.map(function(p){
    var d = byProject[p];
    return { label:NOMES[p]||p, value:d.custo_por_resultado, color:CORES[p]||'#888' };
  }), function(v){ return brl(v); });
  html += pieChart('Resultados por projeto', projKeys.map(function(p){
    return { label:NOMES[p]||p, value:byProject[p].resultados, color:CORES[p]||'#888' };
  }));
  html += barChart('Valor gasto por projeto', projKeys.map(function(p){
    return { label:NOMES[p]||p, value:byProject[p].spend, color:CORES[p]||'#888' };
  }), function(v){ return brl(v); });
  html += '</div>';

  html += '<div class="section-title">Indicadores por projeto</div><div class="cards">';
  projKeys.forEach(function(p){
    var d = byProject[p];
    var objetivo = d.objetivo || 'lead';
    var cor = CORES[p]||'#888';
    html += '<div class="card" style="border-left:3px solid '+cor+'">'+
      '<div class="n">'+brl(d.spend)+'</div><div class="l">'+esc(NOMES[p]||p)+' · objetivo: '+OBJ_LABEL[objetivo]+' · '+d.clicks+' cliques · CPC '+brl(d.cpc)+' · CTR '+d.ctr+'%</div>'+
      '<div class="stat-grid">'+
        '<div>Resultados ('+OBJ_LABEL[objetivo]+') <b>'+d.resultados+'</b></div>'+
        '<div>Custo/resultado <b>'+brl(d.custo_por_resultado)+'</b></div>'+
        (objetivo==='compra'
          ? '<div>Valor da compra <b>'+brl(d.purchase_value)+'</b></div><div>ROAS <b>'+d.roas+'x</b></div>'
          : '<div>Custo por lead <b>'+brl(d.custo_por_lead)+'</b></div><div>Leads <b>'+d.leads+'</b></div>'
        )+
        '<div>Checkout iniciado <b>'+d.initiate_checkout+'</b></div>'+
        '<div>Custo/checkout <b>'+brl(d.custo_por_checkout)+'</b></div>'+
        '<div>Impressões <b>'+d.impressions+'</b></div>'+
        '<div>CPM <b>'+brl(d.cpm)+'</b></div>'+
        '<div>Alcance <b>'+d.reach+'</b></div>'+
        '<div>Frequência <b>'+d.frequency+'</b></div>'+
        '<div>LP views <b>'+d.landing_page_views+'</b></div>'+
      '</div></div>';
  });
  if(!projKeys.length) html += '<div class="empty">Sem dados ainda.</div>';
  html += '</div>';

  html += '<div class="section-title">Campanhas — '+esc(periodo.label)+'</div><div class="camp-list">';
  if(!byCampaign.length){
    html += '<div class="empty">Nenhuma campanha com dados nesse período.</div>';
  } else {
    byCampaign.forEach(function(c){
      var objetivo = c.objetivo || 'lead';
      var cor = CORES[c.projeto]||'#8E7CC3';
      html += '<div class="camp-card" style="border-left-color:'+cor+'">'+
        '<div class="camp-head"><span class="camp-badge" style="background:'+cor+'33;color:'+cor+'">'+esc(NOMES[c.projeto]||c.projeto)+'</span>'+
        '<span class="camp-name">'+esc(c.campaign_name)+'</span></div>'+
        '<div class="camp-top"><div class="camp-spend">'+brl(c.spend)+'</div>'+
        '<div class="camp-sub">'+c.clicks+' cliques · CPC '+brl(c.cpc)+' · CTR '+c.ctr+'%</div></div>'+
        '<div class="stat-grid">'+
          '<div>Resultados ('+OBJ_LABEL[objetivo]+') <b>'+c.resultados+'</b></div>'+
          '<div>Custo/resultado <b>'+brl(c.custo_por_resultado)+'</b></div>'+
          (objetivo==='compra'
            ? '<div>Valor compra <b>'+brl(c.purchase_value)+'</b></div><div>ROAS <b>'+c.roas+'x</b></div>'
            : '<div>Custo/lead <b>'+brl(c.custo_por_lead)+'</b></div><div>Leads <b>'+c.leads+'</b></div>'
          )+
          '<div>Checkout iniciado <b>'+c.initiate_checkout+'</b></div>'+
          '<div>Custo/checkout <b>'+brl(c.custo_por_checkout)+'</b></div>'+
          '<div>CPM <b>'+brl(c.cpm)+'</b></div>'+
          '<div>Alcance <b>'+c.reach+'</b></div>'+
          '<div>Frequência <b>'+c.frequency+'</b></div>'+
          '<div>LP views <b>'+c.landing_page_views+'</b></div>'+
        '</div></div>';
    });
  }
  html += '</div>';
  html += '<div class="updated">Atualizado em '+new Date(data.generated_at||Date.now()).toLocaleString("pt-BR")+'</div>';
  document.getElementById("view").innerHTML = html;
  bindPeriodButtons();
}

function bindPeriodButtons(){
  document.querySelectorAll(".period-btn").forEach(function(btn){
    btn.onclick = function(){ setAdsPeriod(btn.getAttribute("data-period")); };
  });
}

function viewFunil(f){
  var periodo = periodRange(adsPeriod);
  var periodsHtml = '<div class="period-bar">' +
    [["hoje","Hoje"],["3d","3 dias"],["7d","7 dias"],["30d","30 dias"],["total","Total"]].map(function(p){
      return '<button class="period-btn'+(adsPeriod===p[0]?" on":"")+'" data-period="'+p[0]+'">'+p[1]+'</button>';
    }).join('') + '</div>';
  var data = cache[f.id+"_"+adsPeriod];
  if(!data){
    document.getElementById("view").innerHTML = periodsHtml + '<div class="empty">Carregando...</div>';
    bindPeriodButtons();
    return;
  }
  var steps = data.steps||[];
  var totalStart = data.total_sessions||0;
  var conv = convRate(data);
  var html = periodsHtml + '<div class="cards">'+
    '<div class="card"><div class="n">'+totalStart+'</div><div class="l">Sessões iniciadas</div></div>'+
    '<div class="card"><div class="n">'+(data.total_eventos||0)+'</div><div class="l">Eventos registrados</div></div>'+
    '<div class="card"><div class="n">'+conv+'%</div><div class="l">Chegou até a última etapa</div></div>'+
  '</div>';

  html += '<div class="section-title">Etapas do funil</div><div class="funnel">';
  if(!steps.length){
    html += '<div class="empty">Sem dados ainda.</div>';
  } else {
    steps.forEach(function(s,i){
      var dropClass = s.pct_vs_prev>=70 ? "ok" : "";
      html += '<div class="step"><div class="bar" style="width:'+s.pct_of_start+'%;background:linear-gradient(90deg,'+f.color+'38,'+f.color+'10)"></div>'+
        '<div class="step-content">'+
          '<div class="step-left"><span class="step-idx" style="color:'+f.color+'">'+(i+1)+'</span><span class="step-label">'+esc(s.step_label)+'</span></div>'+
          '<div class="step-right">'+
            (i>0?'<span class="drop '+dropClass+'">'+s.pct_vs_prev+'% vs anterior</span>':'')+
            '<span class="step-pct">'+s.pct_of_start+'%</span>'+
            '<span class="step-n">'+s.sessions+'</span>'+
          '</div>'+
        '</div></div>';
    });
  }
  html += '</div>';

  html += '<div class="section-title" style="margin-top:34px">Sessões recentes</div><div class="sessions" id="sessions"></div>';
  html += '<div class="updated">Atualizado em '+new Date(data.generated_at||Date.now()).toLocaleString("pt-BR")+'</div>';
  document.getElementById("view").innerHTML = html;
  bindPeriodButtons();

  var sess = document.getElementById("sessions");
  var list = data.sessions||[];
  if(!list.length){
    sess.innerHTML = '<div class="empty">Nenhuma sessão registrada ainda.</div>';
    return;
  }
  sess.innerHTML = list.map(function(s,i){
    var qas = Object.keys(s.respostas||{}).filter(function(k){ return k !== "origem"; });
    var tag = f.tagField ? (s.respostas||{})[f.tagField] : null;
    var origem = String((s.respostas||{}).origem||"");
    var origemHtml = origem
      ? '<span class="sess-src '+(origem==="tiktok"?"src-tt":origem==="meta"?"src-meta":"src-other")+'">'+
          esc(origem==="tiktok"?"TikTok":origem==="meta"?"Meta":origem)+'</span>'
      : '';
    var answersHtml = qas.length
      ? qas.map(function(q){ return '<div class="ans-row"><span class="ans-q">'+esc(q)+'</span><span class="ans-a">'+esc(s.respostas[q])+'</span></div>'; }).join("")
      : '<div class="ans-empty">Nenhuma pergunta respondida ainda (abandonou antes).</div>';
    var when = s.updated_at ? new Date(s.updated_at).toLocaleString("pt-BR") : "";
    var whenShort = "";
    if(s.updated_at){
      var d = new Date(s.updated_at), mins = Math.floor((Date.now()-d.getTime())/60000);
      var hhmm = d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      var rel = mins < 1 ? "agora" : mins < 60 ? "há "+mins+" min" : mins < 1440 ? "há "+Math.floor(mins/60)+" h" : d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
      whenShort = hhmm+" · "+rel;
    }
    return '<div class="sess" data-i="'+i+'">'+
      '<div class="sess-head">'+
        '<span class="sess-when">'+esc(whenShort)+'</span>'+
        '<div class="sess-right">'+
          origemHtml+
          (tag ? '<span class="sess-tag" style="background:'+f.color+'">'+esc((f.tagPrefix||"")+tag)+'</span>' : '')+
          '<span class="sess-step">'+esc(s.step_label)+'</span>'+
          '<span class="sess-count">'+qas.length+' resp.</span>'+
          '<span class="sess-caret">▸</span>'+
        '</div>'+
      '</div>'+
      '<div class="sess-answers">'+answersHtml+(when?'<div class="ans-row"><span class="ans-q">Última atividade</span><span class="ans-a">'+esc(when)+'</span></div>':'')+
        '<div class="ans-row"><span class="ans-q">Sessão</span><span class="ans-a">'+esc(s.session_id)+'</span></div></div>'+
    '</div>';
  }).join("");
  sess.querySelectorAll(".sess").forEach(function(el){
    el.onclick = function(){ el.classList.toggle("open"); };
  });
}

function draw(){
  renderTabs();
  if(active === "geral"){ viewGeral(); return; }
  var f = FONTES.filter(function(x){ return x.id===active; })[0];
  if(!f){ active="geral"; renderTabs(); viewGeral(); return; }
  if(f.type === "soon"){ viewSoon(f); return; }
  if(f.type === "ads"){ viewAds(f); return; }
  viewFunil(f);
}

function touchRefreshLabel(){
  document.getElementById("lastRefresh").textContent = "atualizado " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}

function load(){
  document.getElementById("view").innerHTML = '<div class="empty">Carregando...</div>';
  loadAll().then(function(){ draw(); touchRefreshLabel(); });
}

document.getElementById("btnRefresh").onclick = function(){ cache = {}; load(); };
try{ var saved = localStorage.getItem("painel_tab"); if(saved) active = saved; }catch(e){}
try{ var savedP = localStorage.getItem("painel_ads_period"); if(savedP) adsPeriod = savedP; }catch(e){}
load();
</script>
