<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Site profissional para sua empresa</title>
<meta name="description" content="Site com 3 páginas, otimizado para o Google e para o celular.">
<meta name="theme-color" content="#15191f">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#15191f; --surface:#1b2028; --surface2:#212733; --line:#2a313b; --line2:#3a434f;
  --teal:#51b5bb; --teal-h:#62c2c8; --teal-d:#3f9aa0; --teal-t:rgba(81,181,187,.10); --teal-ink:#2f7f85;
  --glow:rgba(81,181,187,.35);
  --txt:#eef2f3; --mut:#9aa5ae; --dim:#6b7680;
  --paper:#eef3f4; --paper2:#dfe6e8; --sk:#d1dadd; --sk2:#b9c4c8; --ink:#15191f;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--navy);color:var(--txt);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit}

/* atmosfera: luz ambiente, arco e grão */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb::before{content:"";position:absolute;left:50%;top:-28vh;width:140vw;max-width:900px;height:62vh;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(81,181,187,.20),transparent);animation:breathe 9s ease-in-out infinite}
.arc{position:absolute;left:-55vw;top:58vh;width:125vw;max-width:820px;aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(81,181,187,.38);box-shadow:0 0 90px 12px rgba(81,181,187,.10),inset 0 0 140px 24px rgba(81,181,187,.07),0 0 3px rgba(127,214,219,.6);
  opacity:0;transition:opacity 1.2s ease;animation:arcb 8s ease-in-out infinite}
.show-arc .arc{opacity:1}
.grain{position:absolute;inset:0;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes arcb{50%{box-shadow:0 0 130px 22px rgba(81,181,187,.16),inset 0 0 170px 34px rgba(81,181,187,.10),0 0 4px rgba(127,214,219,.8)}}

#app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:14px 20px calc(18px + env(safe-area-inset-bottom))}

/* topo: voltar + progresso (só nas perguntas) */
.top{display:flex;align-items:center;gap:14px;height:40px;margin-bottom:14px}
.no-top .top{display:none}
.back{width:40px;height:40px;margin-left:-10px;border:0;background:none;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--mut);transition:color .15s}
.back:hover{color:var(--txt)}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prog{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.prog i{height:3px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;background:var(--teal);transform:scaleX(0);transform-origin:0 50%;transition:transform .6s var(--ease)}
.prog i.on::after{transform:scaleX(1)}
.prog i.cur{box-shadow:0 0 10px var(--glow)}

main{flex:1;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column}

/* tipografia */
h1{font:400 43px/1.03 var(--serif);letter-spacing:-.005em;max-width:15ch}
h2{font:400 32px/1.08 var(--serif);max-width:16ch}
h1 em,h2 em{font-style:italic;color:var(--teal)}
h3{font:600 15px/1.3 var(--sans);color:var(--txt)}
.lead{color:var(--mut);font-size:16px;line-height:1.5;margin-top:12px;max-width:36ch}

/* entradas: palavra por palavra e revelação com desfoque */
.wd{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.12em;margin-bottom:-.12em}
.wd>span{display:inline-block;transform:translateY(112%);animation:wd .95s var(--ease) forwards;animation-delay:calc(var(--i)*55ms + 60ms)}
@keyframes wd{to{transform:none}}
.rv{opacity:0;transform:translateY(14px);filter:blur(6px);animation:rv .85s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes rv{to{opacity:1;transform:none;filter:none}}

/* oferta: as 3 páginas */
.offer{padding-top:22px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.tp{margin:0}
.tp-frame{aspect-ratio:4/5;background:var(--paper);border-radius:8px;overflow:hidden;box-shadow:0 18px 40px -22px var(--glow),0 0 0 1px rgba(255,255,255,.04);animation:float 6.5s ease-in-out infinite}
.tp:nth-child(2) .tp-frame{animation-delay:-2.1s}
.tp:nth-child(3) .tp-frame{animation-delay:-4.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tp-top{display:flex;gap:3px;padding:5px 6px;background:var(--paper2)}
.tp-top i{width:4px;height:4px;border-radius:50%;background:var(--sk2)}
.tp-in{padding:9px 8px;display:flex;flex-direction:column;gap:5px}
.tp-in .sk{margin:0;height:5px}
.sk.dk{background:#3b4450;height:6px}
.t-btn{width:46%;height:9px;border-radius:5px;background:var(--teal);margin-top:2px}
.t-img{height:30px;border-radius:4px;background:var(--sk);margin-top:4px}
.t-ava{width:24px;height:24px;border-radius:50%;background:#c3ced2;margin-bottom:2px}
.t-field{height:10px;border-radius:3px;border:1px solid #c3ced2;background:#fff}
.t-map{height:22px;border-radius:4px;background:var(--sk);margin-top:3px}
.tp figcaption{font-size:12.5px;color:var(--mut);margin-top:8px;text-align:center}

.inc{margin-top:28px}
.inc ul{list-style:none;margin-top:4px}
.inc li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.4}
.inc li:first-child{border-top:0}
.inc svg{width:18px;height:18px;flex:none;margin-top:2px;stroke:var(--teal);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ação fixa no rodapé da tela */
.cta{position:sticky;bottom:0;margin:auto -20px 0;padding:18px 20px 2px;background:linear-gradient(to top,var(--navy) 72%,rgba(21,25,31,0))}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border:0;border-radius:14px;
  background:linear-gradient(180deg,#68c6cc,#51b5bb 55%,#45a7ad);color:var(--ink);font:600 17px var(--sans);cursor:pointer;text-decoration:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 30px -8px var(--glow);transition:box-shadow .3s,transform .15s}
.btn::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 5.5s ease-in-out 1.4s infinite}
@keyframes shine{0%{left:-60%}22%,100%{left:130%}}
.btn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 40px -8px rgba(81,181,187,.55)}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 30px -8px var(--glow)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 44px -6px rgba(81,181,187,.6)}}
.note{color:var(--mut);font-size:13.5px;text-align:center;margin-top:10px}
.btn:focus-visible,.opt:focus-visible,.back:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

/* prévia do site do lead */
.pv{position:relative;background:var(--paper);border-radius:12px;overflow:hidden;color:var(--ink);box-shadow:0 22px 48px -26px var(--glow)}
.pv-bar{display:flex;align-items:center;gap:5px;height:24px;padding:0 10px;background:var(--paper2)}
.pv-bar i{width:6px;height:6px;border-radius:50%;background:var(--sk2)}
.pv-url{margin-left:8px;font-size:10.5px;line-height:1;color:#5d6a72;background:var(--paper);border-radius:5px;padding:4px 8px}
.pv-ad{margin-left:auto;font-size:10px;font-weight:600;color:var(--teal-ink)}
.pv-body{padding:10px 12px 12px}
.pv-nav{display:flex;align-items:center;gap:10px;font-size:9.5px;font-weight:500;color:#5d6a72}
.pv-logo{width:18px;height:18px;border-radius:5px;border:1.5px dashed var(--sk2);margin-right:auto;position:relative}
.pv-logo.on{border:0;background:var(--navy)}
.pv-logo.on::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--teal)}
.pv-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.pv-copy{min-width:0;flex:1}
.pv-hl{font:400 17px/1.12 var(--serif);color:var(--ink);max-width:22ch}
.sk{display:block;height:7px;border-radius:4px;background:var(--sk);margin-top:6px;background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);background-size:200% 100%;background-repeat:no-repeat;animation:skel 2.4s ease-in-out infinite}
@keyframes skel{0%{background-position:-150% 0}60%,100%{background-position:250% 0}}
.w90{width:90%}.w80{width:80%}.w75{width:75%}.w60{width:60%}.w55{width:55%}
.pv-g{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:10px;font-weight:600;color:var(--teal-ink)}
.pv-g svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.6}
.pv-wa{flex:none;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;background:var(--sk);color:#8a979e;font-size:10px;font-weight:600}
.pv-wa svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4}
.pv-wa.on{background:var(--teal);color:var(--ink)}
.pv-cap{font-size:12.5px;color:var(--dim);margin-top:8px}
.pv-big .pv-bar{height:28px}
.pv-big .pv-body{padding:14px 16px 16px}
.pv-big .pv-nav{font-size:11px;gap:12px}
.pv-big .pv-logo{width:22px;height:22px}
.pv-big .pv-logo.on::after{inset:6px}
.pv-big .pv-hl{font-size:23px}
.pv-big .pv-g{font-size:11px}
.pv-big .pv-wa{height:28px;font-size:11px;padding:0 12px}
.fresh{animation:fresh .7s var(--ease) .35s both}
.pv-wa.fresh,.pv-logo.fresh{animation:fresh .7s var(--ease) .35s both,ping 1.4s ease-out 1s 1}
@keyframes fresh{from{opacity:0;transform:translateY(5px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(81,181,187,.55)}100%{box-shadow:0 0 0 10px rgba(81,181,187,0)}}
.assemble .pv-logo,.assemble .pv-hl,.assemble .pv-g,.assemble .pv-wa,.assemble .pv-ad{animation:fresh .6s var(--ease) both}
.assemble .pv-logo{animation-delay:.2s}.assemble .pv-hl{animation-delay:.5s}.assemble .pv-g{animation-delay:.85s}
.assemble .pv-wa{animation-delay:1.15s}.assemble .pv-ad{animation-delay:1.35s}
.scan{position:absolute;left:0;right:0;top:0;height:40%;background:linear-gradient(180deg,transparent,rgba(81,181,187,.14),transparent);animation:scan 1.6s ease-in-out infinite;pointer-events:none}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(260%)}}

/* perguntas */
.ask{margin-top:24px}
.opts{display:grid;gap:8px;margin-top:22px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:54px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:500 16px/1.3 var(--sans);text-align:left;cursor:pointer;transition:border-color .2s,background .2s,box-shadow .3s}
.opt::after{content:"";width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);flex:none;transition:background .2s,border-color .2s,transform .3s var(--ease)}
@media (hover:hover){.opt:hover{border-color:var(--line2);background:var(--surface2)}}
.opt.sel{border-color:var(--teal);background:var(--teal-t);box-shadow:0 0 0 4px rgba(81,181,187,.08),0 10px 30px -14px var(--glow)}
.opt.sel::after{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px var(--surface);transform:scale(1.12)}

.field{margin-top:22px}
.field input{width:100%;height:58px;padding:0 16px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--txt);font:500 19px var(--sans);outline:0;transition:border-color .2s,box-shadow .3s}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(81,181,187,.16),0 10px 30px -14px var(--glow)}
.field input::placeholder{color:var(--dim)}
.err{color:#f2a7a7;font-size:14px;min-height:20px;margin-top:8px}
.fine{color:var(--dim);font-size:13.5px;margin-top:12px}
.field .btn{margin-top:6px}

/* carregando e resultado */
.loading{flex:1;display:flex;flex-direction:column;justify-content:center}
.loading .pv{margin-top:26px}
.result{padding-top:22px}
.ok{width:46px;height:46px;margin-bottom:18px}
.ok circle{fill:none;stroke:var(--teal);stroke-width:1.6;stroke-dasharray:151;stroke-dashoffset:151;animation:draw .9s var(--ease) .1s forwards}
.ok path{fill:none;stroke:var(--teal);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s var(--ease) .75s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.result .pv{margin-top:24px}
.next{margin-top:26px}
.next ol{list-style:none;counter-reset:n;margin-top:4px}
.next li{counter-increment:n;display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.35}
.next li:first-child{border-top:0}
.next li::before{content:counter(n);width:26px;height:26px;border-radius:50%;border:1px solid var(--teal);color:var(--teal);font-size:13px;font-weight:600;display:grid;place-items:center;flex:none}

footer{margin-top:26px;font-size:11.5px;line-height:1.55;color:var(--dim)}
footer p+p{margin-top:2px}

@media (min-width:600px){
  #app{padding-top:40px}
  h1{font-size:50px}
  .arc{left:-20vw;top:52vh}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .wd>span,.rv{transform:none;opacity:1;filter:none}
  .ok circle,.ok path{stroke-dashoffset:0}
}
</style>
</head>
<body>
<div class="amb" id="amb" aria-hidden="true"><div class="arc"></div><div class="grain"></div></div>
<div id="app" class="no-top">
  <div class="top">
    <button class="back" id="back" type="button" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="prog" id="prog" role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1" aria-label="Etapa do pedido"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <main id="main"></main>
  <footer><p>Átrio Marketing e Business Ltda.</p><p>Resultados variam conforme o negócio.</p></footer>
</div>

<script>
/* ===== CONFIG (preencher) ===== */
var CFG = {
  STEP_URL : 'https://n8n.manuai.com.br/webhook/funil-site-step',
  LEAD_URL : 'https://n8n.manuai.com.br/webhook/funil-site-lead',
  WHATS    : '5548988055239',                // (48) 98805-5239
  META_PIXEL: '5403951239830409',            // [SITE][VENDA]
  TT_PIXEL : '{{TIKTOK_PIXEL_ID}}',
  FUNIL    : 'quiz-site'
};
/* ===== Pixels (só carregam se IDs preenchidos) ===== */
(function(){
  if(CFG.META_PIXEL.indexOf('{{')<0){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init',CFG.META_PIXEL);fbq('track','PageView');
  }
})();
function ev(name,params,opts){try{if(window.fbq)fbq('track',name,params||{},opts||{});}catch(e){}}
/* Lead com correspondência avançada: o pixel normaliza e criptografa (hash) telefone e nome antes de enviar */
function evLead(){
  try{
    if(!window.fbq)return;
    fbq('init',CFG.META_PIXEL,{ph:A.whatsapp,fn:(A.nome||'').trim().split(/\s+/)[0].toLowerCase(),external_id:SID});
    fbq('track','Lead',{content_name:'Site 3 páginas',content_category:A.nicho||''},{eventID:'lead_'+SID});
  }catch(e){}
}

/* ===== Sessão, origem e UTMs ===== */
function safeGet(s,k){try{return s.getItem(k)}catch(e){return null}}
function safeSet(s,k,v){try{s.setItem(k,v)}catch(e){}}
var SID=safeGet(sessionStorage,'qs_sid');
if(!SID){SID='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);safeSet(sessionStorage,'qs_sid',SID)}
var Q=new URLSearchParams(location.search);
var ORIGEM=safeGet(sessionStorage,'qs_origem');
if(!ORIGEM){
  var us=(Q.get('utm_source')||'').toLowerCase();
  if(us.indexOf('tiktok')>-1||Q.get('ttclid'))ORIGEM='tiktok';
  else if(Q.get('fbclid')||/^(fb|facebook|ig|instagram|meta)$/.test(us))ORIGEM='meta';
  else ORIGEM=us||'direto';
  safeSet(sessionStorage,'qs_origem',ORIGEM);
}
var UTMS={};['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','ttclid'].forEach(function(k){if(Q.get(k))UTMS[k]=Q.get(k)});

/* ===== Respostas e utilidades ===== */
var A={origem:ORIGEM}, leadSentTo='';
var ICON={
 check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
 chat:'<svg viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 01-12.6 7.4L3.5 20.5l1.6-4.3A8.5 8.5 0 1120.5 11.5z"/></svg>'
};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nome(){return A.nome?A.nome.trim().split(/\s+/)[0]:''}

/* Título com entrada palavra por palavra. Trechos entre *asteriscos* ficam em itálico teal */
function title(tag,text){
  var i=0,out='',parts=String(text).split(/(\*[^*]+\*)/);
  parts.forEach(function(p){
    if(!p)return;
    var em=p.charAt(0)==='*',words=(em?p.slice(1,-1):p).split(/\s+/).filter(Boolean);
    var w=words.map(function(x){return '<span class="wd"><span style="--i:'+(i++)+'">'+esc(x)+'</span></span>'}).join(' ');
    out+=(out&&/^\s/.test(p)===false&&!em?'':'')+(em?'<em>'+w+'</em>':w)+' ';
  });
  return '<'+tag+' aria-label="'+esc(String(text).replace(/\*/g,''))+'">'+out.trim()+'</'+tag+'>';
}
function rv(d){return ' class="rv" style="--d:'+d+'s"'}

/* Frase de exemplo que aparece na prévia, por ramo */
var HL={
 'Construção e reformas':'Obras e reformas com prazo e bom acabamento',
 'Saúde e clínicas':'Cuidado de verdade, perto de você',
 'Advocacia e contabilidade':'Orientação clara para decisões importantes',
 'Serviços em geral':'O serviço que você procura, com quem entende',
 'Comércio e lojas':'O que você procura, perto de você',
 'Outro ramo':'Sua empresa, encontrada por quem procura'
};

/* Prévia do site: preenche a cada resposta. fresh = chave recém-respondida */
function preview(big,fresh,assemble){
  var f=function(k){return fresh===k?' fresh':''};
  var hasLogo=!!A.prontidao&&A.prontidao!=='Ainda não tenho nada';
  var ads=!!A.trafego&&A.trafego.indexOf('Sim')===0;
  var hl=A.nicho?'<p class="pv-hl'+f('nicho')+'">'+esc(HL[A.nicho]||HL['Outro ramo'])+'</p>'
                :'<span class="sk w90"></span><span class="sk w60"></span>';
  return '<div class="pv'+(big?' pv-big':'')+(assemble?' assemble':'')+'" aria-hidden="true">'+(assemble?'<span class="scan"></span>':'')+
    '<div class="pv-bar"><i></i><i></i><i></i><span class="pv-url">suaempresa.com.br</span>'+
      (ads?'<span class="pv-ad'+f('trafego')+'">Anúncios ativos</span>':'')+'</div>'+
    '<div class="pv-body">'+
      '<div class="pv-nav"><span class="pv-logo'+(hasLogo?' on':'')+f('prontidao')+'"></span><span>Principal</span><span>Quem somos</span><span>Contato</span></div>'+
      '<div class="pv-hero"><div class="pv-copy">'+hl+
        (A.situacao?'<span class="pv-g'+f('situacao')+'">'+ICON.search+'Encontrada no Google</span>':'')+'</div>'+
        '<span class="pv-wa'+(A.whatsapp?' on':'')+f('whatsapp')+'">'+ICON.chat+'WhatsApp</span></div>'+
    '</div></div>';
}
function previewBlock(fresh){return '<div'+rv(0)+'>'+preview(false,fresh)+'<p class="pv-cap">Prévia do seu site</p></div>'}

function page(n,inner){return '<figure class="tp"><div class="tp-frame"><div class="tp-top"><i></i><i></i><i></i></div><div class="tp-in">'+inner+'</div></div><figcaption>'+n+'</figcaption></figure>'}
function triptych(){
  return '<div class="tri rv" style="--d:.45s" role="img" aria-label="Três páginas: principal, quem somos e contato">'+
    page('Principal','<span class="sk dk w90"></span><span class="sk dk w60"></span><span class="t-btn"></span><span class="t-img"></span>')+
    page('Quem somos','<span class="t-ava"></span><span class="sk w90"></span><span class="sk w75"></span><span class="sk w80"></span><span class="sk w55"></span>')+
    page('Contato','<span class="t-field"></span><span class="t-field"></span><span class="t-btn"></span><span class="t-map"></span>')+
  '</div>';
}

/* ===== Etapas ===== */
var steps=[
 {key:'oferta',label:'1ª tela - oferta',type:'oferta',render:rOferta},
 {key:'nome',label:'2ª tela - nome',type:'texto',render:rNome},
 {key:'nicho',label:'3ª tela - nicho',type:'pergunta',q:function(){return nome()+', qual é o ramo da sua empresa?'},sub:'Assim o seu site fala a língua do seu cliente.',
   opts:['Construção e reformas','Saúde e clínicas','Advocacia e contabilidade','Serviços em geral','Comércio e lojas','Outro ramo']},
 {key:'situacao',label:'4ª tela - situação do site',type:'pergunta',q:function(){return nome()+', como está o site da sua empresa hoje?'},sub:'Para entender de onde partimos.',
   opts:['Não tenho site','Tenho, mas não aparece no Google','Tenho, mas não gera clientes']},
 {key:'whatsapp',label:'5ª tela - whatsapp',type:'contato',render:rZap},
 {key:'prontidao',label:'6ª tela - material pronto',type:'pergunta',q:function(){return nome()+', você já tem logo e fotos da empresa?'},sub:'Isso ajuda a preparar a sua proposta.',
   opts:['Sim, tenho logo e fotos','Tenho só o logo','Ainda não tenho nada']},
 {key:'trafego',label:'7ª tela - interesse tráfego',type:'pergunta',q:function(){return nome()+', depois do site, quer receber clientes também por anúncio?'},sub:'Anúncios levam clientes direto para o seu site.',
   opts:['Sim, quero site e anúncios','Primeiro só o site']},
 {key:'loading',label:'8ª tela - analisando',type:'loading',render:rLoading},
 {key:'resultado',label:'9ª tela - resultado',type:'resultado',render:rResultado}
];
var idx=0,lastKey=null,main=document.getElementById('main'),app=document.getElementById('app'),amb=document.getElementById('amb'),
    prog=document.getElementById('prog'),bars=prog.querySelectorAll('i');

function track(s,extra){
  if(!CFG.STEP_URL)return;
  var p={session_id:SID,step_index:steps.indexOf(s),step_total:steps.length,step_label:s.label,step_type:s.type,origem:CFG.FUNIL,
         respostas_ate_aqui:JSON.stringify(A)};
  if(extra)for(var k in extra)p[k]=extra[k];
  try{fetch(CFG.STEP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p),keepalive:true}).catch(function(){})}catch(e){}
}
function goTo(i){
  idx=i;var s=steps[i];
  var asking=i>=1&&i<=6;
  app.className=asking?'':'no-top';
  amb.className='amb'+((s.type==='oferta'||s.type==='resultado')?' show-arc':'');
  if(asking){
    for(var b=0;b<bars.length;b++)bars[b].className=(b<i?'on':'')+(b===i-1?' cur':'');
    prog.setAttribute('aria-valuenow',i);
  }
  (s.render||rPergunta)(s);
  lastKey=null;
  track(s);
  try{window.scrollTo(0,0)}catch(e){}
}
function answered(key){lastKey=key;goTo(idx+1)}
document.getElementById('back').onclick=function(){if(idx>0)goTo(idx-1)};
function screen(cls,html){main.innerHTML='<section class="screen '+cls+'">'+html+'</section>'}

/* ===== Telas ===== */
function rOferta(){
  screen('offer',
    title('h1','Tenha um site que coloca sua empresa *no Google*')+
    '<p'+rv(.35)+'><span class="lead" style="display:block">Responda 6 perguntas rápidas e receba sua proposta pelo WhatsApp.</span></p>'+
    triptych()+
    '<div class="inc rv" style="--d:.6s"><h3>O que você recebe</h3><ul>'+
      '<li>'+ICON.check+'Site com 3 páginas: principal, quem somos e contato</li>'+
      '<li>'+ICON.check+'Site otimizado para o Google</li>'+
      '<li>'+ICON.check+'Visual profissional</li>'+
      '<li>'+ICON.check+'Otimizado para mobile</li>'+
      '<li>'+ICON.check+'Botão direto para o seu WhatsApp</li>'+
    '</ul></div>'+
    '<div class="cta"><div'+rv(.75)+'><button class="btn pulse" id="go" type="button">Tenho interesse</button><p class="note">Leva 1 minuto. Sem compromisso.</p></div></div>');
  document.getElementById('go').onclick=function(){ev('ViewContent');goTo(1)};
}
function rNome(){
  screen('',previewBlock(null)+
    '<div class="ask">'+title('h2','Como posso te chamar?')+'<p class="lead rv" style="--d:.3s">Vamos montar o pedido do seu site.</p></div>'+
    '<div class="field rv" style="--d:.4s"><input id="i" type="text" placeholder="Seu nome" autocomplete="given-name" maxlength="60" aria-label="Seu nome">'+
    '<p class="err" id="e" role="alert"></p><button class="btn" id="b" type="button">Continuar</button></div>');
  var i=document.getElementById('i');
  if(A.nome)i.value=A.nome;
  function ok(){var v=i.value.trim();if(v.length<2){document.getElementById('e').textContent='Digite seu nome para continuar.';i.focus();return}
    A.nome=v;answered('nome')}
  document.getElementById('b').onclick=ok;
  i.addEventListener('keydown',function(e){if(e.key==='Enter')ok()});
  setTimeout(function(){try{i.focus({preventScroll:true})}catch(e){}},500);
}
function rPergunta(s){
  var h=previewBlock(lastKey)+'<div class="ask">'+title('h2',s.q())+(s.sub?'<p class="lead rv" style="--d:.3s">'+esc(s.sub)+'</p>':'')+'</div><div class="opts">';
  s.opts.forEach(function(o,n){h+='<button class="opt rv'+(A[s.key]===o?' sel':'')+'" style="--d:'+(.38+n*.06).toFixed(2)+'s" type="button" data-n="'+n+'">'+esc(o)+'</button>'});
  screen('',h+'</div>');
  main.querySelectorAll('.opt').forEach(function(el){el.onclick=function(){
    main.querySelectorAll('.opt.sel').forEach(function(x){x.classList.remove('sel')});
    el.classList.add('sel');A[s.key]=s.opts[+el.dataset.n];
    setTimeout(function(){answered(s.key)},320)}});
}
function maskZap(v){v=v.replace(/\D/g,'').slice(0,11);
  if(v.length>6)return '('+v.slice(0,2)+') '+v.slice(2,v.length-4)+'-'+v.slice(-4);
  if(v.length>2)return '('+v.slice(0,2)+') '+v.slice(2);return v}
function rZap(){
  screen('',previewBlock(lastKey)+
    '<div class="ask">'+title('h2',nome()+', qual é o seu WhatsApp?')+'<p class="lead rv" style="--d:.3s">Enviamos sua proposta e o próximo passo por lá.</p></div>'+
    '<div class="field rv" style="--d:.4s"><input id="i" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" autocomplete="tel-national" aria-label="WhatsApp com DDD">'+
    '<p class="err" id="e" role="alert"></p><button class="btn" id="b" type="button">Continuar</button>'+
    '<p class="fine">Usamos seu número só para falar sobre o seu site.</p></div>');
  var i=document.getElementById('i'),b=document.getElementById('b');
  if(A.whatsapp)i.value=maskZap(A.whatsapp.slice(2));
  i.oninput=function(){i.value=maskZap(i.value)};
  function ok(){var d=i.value.replace(/\D/g,'');
    if(d.length<10||d.length>11||/^(\d)\1+$/.test(d)||+d.slice(0,2)<11){document.getElementById('e').textContent='Confira o número com DDD.';i.focus();return}
    A.whatsapp='55'+d;b.disabled=true;
    if(leadSentTo!==A.whatsapp){sendLead();evLead();leadSentTo=A.whatsapp}
    answered('whatsapp')}
  b.onclick=ok;i.addEventListener('keydown',function(e){if(e.key==='Enter')ok()});
  setTimeout(function(){try{i.focus({preventScroll:true})}catch(e){}},500);
}
function sendLead(){
  var p={session_id:SID,event_id:'lead_'+SID,funil:CFG.FUNIL,nome:A.nome,whatsapp:A.whatsapp,nicho:A.nicho,situacao:A.situacao,origem:ORIGEM,utms:UTMS,url:location.href};
  try{fetch(CFG.LEAD_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p),keepalive:true}).catch(function(){})}catch(e){}
}
function rLoading(){
  screen('loading',title('h2','Montando a prévia do seu site')+'<p class="lead rv" style="--d:.3s">Juntando as suas respostas.</p>'+preview(true,null,true));
  setTimeout(function(){if(idx===7)goTo(8)},2100);
}
var DIAG={
 'Não tenho site':'Hoje seus clientes não encontram sua empresa quando pesquisam. Um site no ar muda isso.',
 'Tenho, mas não aparece no Google':'Seu site existe, mas não está estruturado para ser encontrado por quem busca seu serviço.',
 'Tenho, mas não gera clientes':'Seu site está no ar, mas não leva o visitante a pedir orçamento. Falta estrutura de conversão.'
};
function rResultado(s){
  ev('CompleteRegistration');
  var q=A.situacao||'Não tenho site';
  var semMaterial=A.prontidao==='Ainda não tenho nada';
  var msg='Olá! Sou '+A.nome+' e acabei de pedir meu site. Ramo: '+(A.nicho||'-')+'. Situação: '+q+'. Material: '+(A.prontidao||'-')+'.';
  var wa='https://wa.me/'+CFG.WHATS+'?text='+encodeURIComponent(msg);
  screen('result',
    '<svg class="ok" viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="24"/><path d="M15.5 25.5l6.5 6.5 12.5-13"/></svg>'+
    title('h2',nome()+', seu pedido foi *registrado.*')+
    '<p class="lead rv" style="--d:.35s">'+esc(DIAG[q])+'</p>'+
    '<div'+rv(.5)+'>'+preview(true)+'<p class="pv-cap">Prévia do seu site</p></div>'+
    '<div class="next rv" style="--d:.65s"><h3>Próximos passos</h3><ol>'+
      '<li>Você chama no WhatsApp</li>'+
      '<li>'+(semMaterial?'Recebe nossa orientação para logo e fotos':'Envia logo e fotos')+'</li>'+
      '<li>Seu site entra em produção</li>'+
    '</ol></div>'+
    '<div class="cta"><div'+rv(.8)+'><a class="btn pulse" id="wa" href="'+wa+'" target="_blank" rel="noopener">'+ICON.chat+'Chamar no WhatsApp</a></div></div>');
  document.getElementById('wa').addEventListener('click',function(){
    ev('Contact');track(s,{step_label:'Clicou WhatsApp',step_type:'whatsapp_click'})});
}
goTo(0);
</script>
</body>
</html>
