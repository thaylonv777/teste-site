<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · Quiz Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#15191f; --navy2:#1c222b; --teal:#51b5bb; --teal-d:#3d8d92;
  --ink:#eef1f3; --ink-dim:#9aa5ac; --line:rgba(255,255,255,.08);
  --serif:'Instrument Serif',serif; --sans:'Schibsted Grotesk',system-ui,sans-serif;
  --ok:#6fd0a0; --warn:#e0b65c;
}
*{box-sizing:border-box;min-width:0}
html{overflow-x:hidden}
body{margin:0;background:var(--navy);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%}
header{padding:20px 16px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(20px,6vw,28px);margin:0;letter-spacing:.2px}
h1 em{color:var(--teal);font-style:normal}
.sub{color:var(--ink-dim);font-size:13px;margin-top:4px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters input{background:var(--navy2);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:8px;font-family:var(--sans);font-size:13px;max-width:140px}
.filters button{background:var(--teal);color:#07262a;border:none;padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.filters button:hover{background:#63c3c9}
main{max-width:1180px;margin:0 auto;padding:16px;width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.card{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card .n{font-family:var(--serif);font-size:clamp(24px,7vw,34px);color:var(--teal)}
.card .l{color:var(--ink-dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
section{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;max-width:100%;overflow:hidden}
section h2{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 12px}
.step{display:grid;grid-template-columns:20px 1fr 34px 46px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.step:last-child{border-bottom:none}
.step .idx{color:var(--ink-dim)}
.step .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .bar{display:none}
.step .pct{text-align:right;color:var(--ink-dim);white-space:nowrap}
@media(min-width:620px){
  .step{grid-template-columns:28px 1fr 50px 60px 140px}
  .step .bar{display:block;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
}
.step .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-d),var(--teal))}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
th{text-align:left;color:var(--ink-dim);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:7px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.sess{cursor:pointer}
tr.sess:hover{background:rgba(255,255,255,.03)}
.tag{display:inline-block;background:rgba(81,181,187,.14);color:var(--teal);border-radius:6px;padding:2px 7px;font-size:10px;white-space:nowrap}
.detail{display:none;background:rgba(0,0,0,.18)}
.detail td{white-space:normal}
.detail pre{margin:0;padding:10px;font-size:11px;color:var(--ink-dim);white-space:pre-wrap;word-break:break-word;max-width:100%;overflow-x:auto}
.empty{color:var(--ink-dim);font-size:13px;padding:20px 0;text-align:center}
.loading{color:var(--ink-dim);font-size:13px}
@media(max-width:480px){
  table,thead,tbody,th,td,tr{display:block}
  thead{display:none}
  tr.sess{border-bottom:1px solid var(--line);padding:8px 0}
  td{border-bottom:none;padding:2px 0;white-space:normal}
  td:before{content:attr(data-l);color:var(--ink-dim);font-size:10px;text-transform:uppercase;display:block}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Dashboard <em>quiz · site</em></h1>
    <div class="sub">Funil de geração de leads — venda de site</div>
  </div>
  <div class="filters">
    <input type="date" id="since">
    <input type="date" id="until">
    <button id="apply">Filtrar</button>
  </div>
</header>
<main>
  <div class="cards" id="cards">
    <div class="card"><div class="n" id="cTotal">–</div><div class="l">Sessões iniciadas</div></div>
    <div class="card"><div class="n" id="cEventos">–</div><div class="l">Eventos registrados</div></div>
    <div class="card"><div class="n" id="cFinal">–</div><div class="l">% chegou na última etapa</div></div>
  </div>

  <section>
    <h2>Funil por etapa</h2>
    <div id="steps" class="loading">Carregando…</div>
  </section>

  <section>
    <h2>Sessões recentes</h2>
    <div id="sessionsWrap" class="loading">Carregando…</div>
  </section>
</main>

<script>
var CFG = { STATS_URL: 'https://n8n.manuai.com.br/webhook/funil-site-stats' };

function fmtDate(iso){
  if(!iso) return '–';
  var d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function render(data){
  document.getElementById('cTotal').textContent = data.total_sessions || 0;
  document.getElementById('cEventos').textContent = data.total_eventos || 0;
  var steps = data.steps || [];
  var last = steps.length ? steps[steps.length-1] : null;
  document.getElementById('cFinal').textContent = last ? last.pct_of_start + '%' : '–';

  var stepsEl = document.getElementById('steps');
  if(!steps.length){
    stepsEl.innerHTML = '<div class="empty">Sem dados no período.</div>';
  } else {
    stepsEl.innerHTML = steps.map(function(s){
      var vsCls = s.pct_vs_prev >= 90 ? 'up' : (s.pct_vs_prev < 60 ? 'down' : '');
      return '<div class="step">' +
        '<div class="idx">'+(s.step_index+1)+'</div>' +
        '<div class="lbl">'+(s.step_label||'')+'</div>' +
        '<div class="pct">'+s.sessions+'</div>' +
        '<div class="pct">'+s.pct_of_start+'%</div>' +
        '<div class="bar"><i style="width:'+s.pct_of_start+'%"></i></div>' +
      '</div>';
    }).join('');
  }

  var sessions = data.sessions || [];
  var wrap = document.getElementById('sessionsWrap');
  if(!sessions.length){
    wrap.innerHTML = '<div class="empty">Nenhuma sessão no período.</div>';
    return;
  }
  var rows = sessions.map(function(s, i){
    var r = s.respostas || {};
    return '<tr class="sess" data-i="'+i+'">' +
      '<td data-l="Nome">'+(r.nome||'–')+'</td>' +
      '<td data-l="WhatsApp">'+(r.whatsapp||'–')+'</td>' +
      '<td data-l="Nicho">'+(r.nicho||'–')+'</td>' +
      '<td data-l="Chegou até"><span class="tag">'+(s.step_label||'etapa '+(s.step_index+1))+'</span></td>' +
      '<td data-l="Atualizado">'+fmtDate(s.updated_at)+'</td>' +
    '</tr>' +
    '<tr class="detail" id="d'+i+'"><td colspan="5"><pre>'+JSON.stringify(r,null,2)+'</pre></td></tr>';
  }).join('');
  wrap.innerHTML = '<table><thead><tr><th>Nome</th><th>WhatsApp</th><th>Nicho</th><th>Chegou até</th><th>Atualizado</th></tr></thead><tbody>'+rows+'</tbody></table>';
  wrap.querySelectorAll('tr.sess').forEach(function(tr){
    tr.addEventListener('click', function(){
      var d = document.getElementById('d'+tr.dataset.i);
      d.style.display = d.style.display === 'table-row' ? 'none' : 'table-row';
    });
  });
}

function load(){
  var since = document.getElementById('since').value;
  var until = document.getElementById('until').value;
  var url = CFG.STATS_URL + '?since=' + encodeURIComponent(since||'') + '&until=' + encodeURIComponent(until||'');
  document.getElementById('steps').innerHTML = '<div class="loading">Carregando…</div>';
  document.getElementById('sessionsWrap').innerHTML = '<div class="loading">Carregando…</div>';
  fetch(url).then(function(r){return r.json()}).then(render).catch(function(e){
    document.getElementById('steps').innerHTML = '<div class="empty">Erro ao carregar dados.</div>';
  });
}
document.getElementById('apply').addEventListener('click', load);
load();
</script>
</body>
</html>
